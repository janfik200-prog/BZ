# ═══════════════════════════════════════════════════════════════════════════
#  КАТАЛОГ ИСТОЧНИКОВ
#
#  Это единственное место, где добавляются источники. Python править не нужно
#  ни в одном из трёх случаев ниже.
#
#  mode — как источник доступен:
#     api     официальный программный интерфейс. Только такие опрашиваются
#             автоматически по расписанию.
#     html    документ забирается по прямой ссылке, поиска по сайту нет.
#     manual  нужен человек: форма поиска, капча, логин. В автоматику не идёт.
#
#  Опрашиваются только записи с mode: api и enabled: true. Остальные остаются
#  здесь как память: откуда ещё берутся статьи и почему они не в автоматике.
#
# ───────────────────────────────────────────────────────────────────────────
#  КАК ДОБАВИТЬ ИСТОЧНИК
#
#  1. У источника есть готовый провайдер (openalex, crossref).
#     Копируете запись и меняете параметры. Например, искать только у Springer:
#     provider: crossref с параметром member: 297.
#
#  2. У источника свой JSON API — provider: json_api. Описываете, куда
#     обращаться и где в ответе лежат поля. Кода не нужно совсем.
#     Пути в map читаются так:
#         title                 item["title"]
#         externalIds.DOI       item["externalIds"]["DOI"]
#         authors[].name        имена всех авторов из списка
#         oa.url|link.url       первый непустой из двух путей
#     Если по пути оказался список, берётся первый элемент.
#     Если в url есть {query}, запрос подставляется в адрес, а не в параметры.
#     Шаблон — в записи example_json_api ниже.
#
#  3. Источник отдаёт не JSON, а своё (XML, Atom, HTML). Только этот случай
#     требует модуля в acquire/providers/ — всё остальное делается здесь.
# ═══════════════════════════════════════════════════════════════════════════

sources:

  - name: openalex
    mode: api
    provider: openalex
    enabled: true
    params:
      mailto: ""           # ваш e-mail: переводит запросы в polite pool, ответы ровнее
      api_key: ""          # не обязателен; с ключом дневной лимит в 10 раз выше
      per_page: 50
      min_year: 2000       # уберите строку, если нужна вся глубина
      only_oa: false       # true — только статьи с открытым доступом
      types:
        - article
        - review
        - preprint
    notes: >
      250+ млн работ, индексирует русскую периодику с DOI: «Отечественная геология»,
      «Руды и металлы», «Региональная геология и металлогения». Ключа не требует,
      проверок на робота нет. Собирает копии статей по репозиториям, поэтому полных
      текстов находит больше остальных.

  - name: crossref
    mode: api
    provider: crossref
    enabled: true
    params:
      mailto: ""
      min_year: 2000
      per_page: 50
      only_with_fulltext: false   # true — только записи с задепонированной ссылкой
      types:
        - journal-article
    notes: >
      Вся периодика с DOI без фильтра по издателю, включая русские журналы и статьи
      MDPI. Официальный API, без ключа. Аннотацию депонируют не все издатели: часть
      статей отбирается по одному названию, для них порог отбора снижается сам.

  - name: mdpi
    mode: api
    provider: crossref
    enabled: true
    params:
      mailto: ""
      member: 1968         # MDPI AG в Crossref
      min_year: 2000
      per_page: 50
      types:
        - journal-article
    notes: >
      Свой поиск у MDPI закрыт в robots.txt (Disallow: /search*), поискового API у
      издателя нет — ищем через Crossref, где зарегистрированы все его статьи.
      Скачивание PDF с mdpi.com robots.txt не запрещает. Отдельная запись нужна,
      чтобы работы издателя гарантированно попадали в выборку, даже когда в общем
      поиске по релевантности их обходят другие. Дубли схлопываются по DOI.
      Осторожно: сайт за Cloudflare и иногда отдаёт скриптам проверку вместо файла —
      тогда пробуется следующая копия полного текста.
      Журналы по вашей теме: Minerals, Geosciences, Remote Sensing.

  # ─── Шаблон источника, описанного без кода. Проверьте имена полей по
  #     документации нужного API и поставьте enabled: true.
  - name: example_json_api
    mode: api
    provider: json_api
    enabled: false
    params:
      url: https://api.example.org/search
      query_param: q             # в каком параметре уходит запрос
      limit_param: limit         # в каком параметре уходит количество
      extra_params:              # что всегда добавлять к запросу
        fields: title,abstract,year,authors,doi
      headers: {}                # если нужен токен: {Authorization: Bearer ...}
      items_path: data           # где в ответе лежит список результатов
      map:                       # где в записи лежит каждое поле
        external_id: id
        title: title
        abstract: abstract
        year: year
        journal: venue
        doi: externalIds.DOI
        authors: authors[].name
        pdf_url: openAccessPdf.url
        landing_page_url: url
    notes: >
      Так добавляется любой поисковый API, отдающий JSON, — не трогая Python.

  - name: cyberleninka
    mode: html
    enabled: false
    notes: >
      Полные тексты русских статей в открытом доступе, но страница поиска закрыта
      в robots.txt — автоматически обходить поиск не будем. Статьи берутся по прямым
      ссылкам, их список — в corpus/corpus.json.

  - name: lens
    mode: manual
    enabled: false
    notes: >
      Форма поиска и проверка «Verifying you are a valid user». Те же работы отдаёт
      OpenAlex через открытый API, поэтому для автоматики Lens не нужен.

  - name: elibrary
    mode: manual
    enabled: false
    notes: >
      Нужен институциональный логин, скриптом не обойти. Статьи оттуда добавляются
      руками: положить PDF в data/pdf или текст в data/manual.
