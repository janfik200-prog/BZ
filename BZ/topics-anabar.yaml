# Темы по Анабарскому щиту и его окружению.
#
# Общие темы из topics.yaml описывают МЕТОД — как вообще выделяют рудные узлы.
# Эти описывают ОБЪЕКТ — конкретную территорию, её геологию и её полезные
# ископаемые. Для базы нужны обе половины: по методу приходят статьи о том, как
# считать, по объекту — о том, что там на самом деле лежит.
#
# Запуск:
#   python georag.py all --topics topics-anabar.yaml
#
# Чего ожидать честно: литература по Анабару почти вся русская и значительная
# её часть живёт в eLibrary и фондах ВСЕГЕИ, куда автоматика не попадает — там
# нет ни открытых PDF, ни поискового API. Что-то найдётся через OpenAlex
# и CyberLeninka, но урожай будет скромнее, чем по англоязычным темам.
# Ненайденное придётся добирать руками — для этого в проекте есть ручные
# источники в sources.yaml.

topics:
  # --- сам щит ---
  - Анабарский щит геологическое строение
  - Анабарский щит металлогения
  - Анабарский щит рудные узлы
  - Анабарский массив докембрий
  - Anabar shield geology
  - Anabar shield metallogeny

  # --- окружение: то же самое геологическое целое ---
  - Оленёкское поднятие алмазоносность
  - Куонамский комплекс
  - север Сибирской платформы прогноз оруденения
  - Сибирский кратон металлогения докембрия
  - Siberian craton Precambrian metallogeny

  # --- что там ищут ---
  - Якутская алмазоносная провинция прогноз
  - кимберлитовые поля Якутии прогнозирование
  - Далдыно-Алакитский район кимберлиты
  - алмазоносность северо-востока Сибирской платформы
  - kimberlite fields Yakutia prospecting
  - редкометалльное оруденение Анабарского щита

  # --- методы применительно к этой территории ---
  - дистанционное зондирование Анабарский щит
  - геофизические поля севера Сибирской платформы
  - линеаментный анализ Сибирская платформа
