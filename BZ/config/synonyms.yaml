# СЛОВАРЬ СИНОНИМОВ — разные написания одного и того же сводятся к одному имени.
#
# Правится Блокнотом, сохранять в UTF-8. Действует сразу — модель заново
# проходить не нужно (страницу в браузере обновить, бота перезапускать не надо).
#
#   каноническое имя: [как ещё пишут, как ещё пишут]
#
# Падеж и число не важны: «Донецкого бассейна» и «Donetsk basins» узнаются сами.
# Чего здесь нет, в граф идёт как написала модель.
#
# Пополнять: python georag.py synonyms — модель найдёт похожие имена и положит
# предложения в config\synonyms-предложения.yaml; нужные строки перенесите сюда.
#
# «связи» — то же для связей: «приурочен к» и «приурочено к» узнаются сами,
# а разные слова об одном («контролирует», «определяет положение») — сводите здесь.
#
# «входит в» — особая связь: часть → целое. По ней датасет щита собирает и
# факты о его зонах. «включает» — она же наоборот (раздел «обратные» в конце).
#
# Сюда — только настоящие синонимы: перевод, сокращение, другое написание.
# Частное и общее («random forest» и «машинное обучение»), часть и целое —
# НЕ синонимы: такие связи модель записывает фактами.

имена:
  Сибирская платформа: [Siberian platform, Сибирский кратон, Siberian craton]
  Анабарский щит: [Anabar shield, Анабарский массив, Anabar massif]
  Билляхская зона: [Билляхская тектоно-флюидитная зона, Билляхская зона разломов, Billyakh zone, Billyakh shear zone]
  Хаптасыннахская зона: [Khaptasynnakh zone]
  Оленёкское поднятие: [Оленекское поднятие, Olenek uplift]
  Донецкий бассейн: [Donetsk basin, Донбасс, Donbass]
  Восточный Циньлин: [East Qinling]
  Крайчиковское рудопроявление: [Kraichikovo ore occurrence, Kraichikovo]
  дистанционное зондирование: [remote sensing, ДЗЗ, дистанционное зондирование Земли]
  линеаментный анализ: [lineament analysis]
  аэрогамма-спектрометрия: [АГСМ, аэрогамма-спектрометрическая съёмка, airborne gamma-ray spectrometry]
  гравиразведка: [гравиметрическая съёмка, gravity survey]
  магниторазведка: [магнитометрическая съёмка, magnetic survey]
  геохимическая съёмка: [geochemical survey]
  прогнозное моделирование: [prospectivity modelling, prospectivity modeling, mineral prospectivity mapping, prospectivity mapping]
  машинное обучение: [machine learning]
  метод весов доказательств: [веса доказательств, weights of evidence, WofE]
  кокригинг: [cokriging, co-kriging]
  метод главных компонент: [анализ главных компонент, PCA, principal component analysis]
  метод спектрального угла: [spectral angle mapper, SAM]
  метасоматоз: [метасоматизм, metasomatism]
  калиевый метасоматоз: [калиевый метасоматизм, калишпатизация, potassic alteration]
  гидротермальные изменения: [hydrothermal alteration]
  гидротермально-метасоматические изменения: [гидротермально-метасоматические преобразования, гидротермально-метасоматические преобразования пород]
  окварцевание: [silicification]
  серицитизация: [sericitization, sericitisation]
  березитизация: [beresitization]
  аргиллизация: [argillic alteration]
  пропилитизация: [propylitization, propylitic alteration]
  милонитизация: [mylonitization, mylonitisation]
  брекчирование: [brecciation]
  катаклаз: [катаклаз пород, cataclasis]
  метаморфизм: [metamorphism]
  магматизм: [magmatism]
  выветривание: [weathering]
  кора выветривания: [weathering crust]
  россыпеобразование: [формирование россыпей, placer formation]

связи:
  входит в: [является частью, part of, is part of, входят в, входит в состав, входят в состав]
  приурочено к: [приурочен к, приурочены к, приурочена к, associated with, hosted by]
  выявлено методом: [выделено методом, выявлено по данным, выделено по данным, detected by, identified by]
  связано с: [связан с, связана с, связаны с, related to]
  характеризуется: [характеризуются]
  сопровождается: [сопровождаются, accompanied by]
  расположено в: [расположен в, расположена в, расположены в, расположены, расположено, located in]
  совпадает с: [совпадают с, coincides with]
  контролирует: [контролируют, controls]

# «обратные» — та же связь в другую сторону: «щит включает зону» = «зона входит в щит».
# Такие факты разворачиваются при чтении: слева — связь, как её хранить, справа —
# как пишут наоборот.
обратные:
  входит в: [включает, включают, включает в себя, состоит из, contains, includes]
  контролирует: [контролируется, контролируются, controlled by]
