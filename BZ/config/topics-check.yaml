# Темы для проверки базы: по одной-две на каждое понятие словаря и на каждый
# блок вопросов из eval-questions.yaml. Задача — чтобы на каждый вопрос оценки
# в базе были статьи, и по отчёту было видно, как работает поиск и чат-бот,
# а не то, что статей по теме просто нет.
#
# Запуск:
#   python georag.py all --topics topics-check.yaml
#   python georag.py ingest
#   python georag.py graph
#   python georag.py eval
#
# Английские темы нужны: по рудному прогнозу большая часть открытых статей —
# англоязычные, и BGE-M3 находит их по русскому вопросу.

