# Вопросы для оценки базы знаний и чат-бота.
#
# Запуск:
#     python georag.py eval                 поиск и ответы (нужна Ollama)
#     python georag.py eval --only-search   только поиск, без модели
#
# Отчёт — в logs/eval-<дата>.md (читать) и .json (для сравнения прогонов).
# Каждый следующий прогон сравнивается с прошлым: видно, стало лучше или хуже.
#
# Поля вопроса:
#   вопрос     — как его задал бы геолог;
#   ожидание   — «база»: ответ должен быть в статьях; «без базы» — контрольный
#                вопрос не по теме, бот обязан сказать, что в базе такого нет;
#   ключевые   — что должно встретиться в найденных фрагментах и в ответе.
#                Каждая строка — одна мысль; через | — синонимы, в том числе
#                английские. Слова пишутся в любой форме: окончания код снимает;
#   понятие    — тема вопроса, для сводки в отчёте (любые слова);
#   территория, метод — то же, если вопрос про них;
#   статьи     — необязательно: doc_id статей, которые поиск обязан найти (как во
#                вкладке «Статьи», например 10.52349_0869-7892_2024_100_147-164).
#                Это самая честная проверка поиска: ключевые слова говорят только,
#                что в найденном есть нужные слова, а статьи — что найдено именно то.
#                Проходит, если найдена хотя бы половина.
#
# Добавлять вопросы можно сколько угодно; id должен быть новым. Хороший вопрос
# — тот, на который вы сами знаете ответ по статьям базы: тогда по отчёту
# видно, нашёл ли его бот.

