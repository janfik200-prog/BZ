# Словарь базы знаний: понятия, территории, методы и связи между ними.
#
# Правится руками, код не меняется. После правки — перестроить разметку:
#     python georag.py graph
#
# ПОНЯТИЯ — копия справочника kb.concept из базы данных проекта (gis_au_u).
# Код понятия должен совпадать с kb.concept.code буква в букву, включая «ё»:
# по нему ответ базы знаний ложится в bridge.feature_concept на той стороне.
# Новое понятие сначала заводится там, потом переносится сюда. Определения
# взяты оттуда же дословно — по ним ищутся похожие фрагменты статей.
#
# СИНОНИМЫ — слова, по которым понятие находится в тексте. Писать в любой
# форме: окончания код снимает сам, «окварцевание» найдёт и «окварцевания»,
# и «окварцеванием». Слова через пробел ищутся подряд. Аббревиатуры (ЦМР, NDVI)
# ищутся как есть, с учётом регистра. Английские слова нужны: часть статей
# на английском.

понятия:

  структурный контроль:
    род: рудоконтролирующий фактор
    определение: >-
      Приуроченность оруднения к разломам, зонам дробления, милонитизации и
      тектонического меланжа, прежде всего к узлам их пересечения. Для района —
      Билляхская тектоно-флюидитная зона северо-западного простирания около
      250 км, наследующая древнее структурное несогласие.
    синонимы:
      - структурный контроль
      - разломная тектоника
      - разрывное нарушение
      - зона дробления
      - милонитизация
      - тектонический меланж
      - тектоно-флюидитная зона
      - сдвиговая зона
      - пересечение разломов
      - structural control
      - shear zone
      - fault intersection
      - mylonite

  гидротермальные изменения:
    род: рудоконтролирующий фактор
    определение: >-
      Околорудная переработка пород горячими растворами. Для Хаптасыннахской
      зоны описаны две стадии: ранний калиевый метасоматизм и позднее
      окварцевание с серицитизацией.
    синонимы:
      - гидротермальное изменение
      - гидротермально измененные породы
      - метасоматоз
      - метасоматизм
      - метасоматит
      - окварцевание
      - серицитизация
      - березитизация
      - аргиллизация
      - пропилитизация
      - лиственитизация
      - каолинизация
      - hydrothermal alteration
      - alteration zone
      - sericitization
      - silicification
      - propylitic

  литологический контроль:
    род: рудоконтролирующий фактор
    определение: >-
      Приуроченность оруднения к определённым толщам и породам: архейским
      метаморфитам, протерозойским терригенным толщам, гранитоидам. Связь
      именно со специализацией тектоно-флюидитных зон, а не с фациями вообще,
      в проекте не проверена.
    синонимы:
      - литологический контроль
      - литологический фактор
      - вмещающие породы
      - вмещающая толща
      - благоприятная толща
      - рудовмещающая толща
      - lithological control
      - host rock

  магматизм:
    род: рудоконтролирующий фактор
    определение: >-
      Участие магматических тел как источника тепла и растворов, а также как
      жёстких неоднородностей, влияющих на структуру.
    синонимы:
      - магматизм
      - интрузия
      - интрузивный массив
      - интрузивный комплекс
      - дайка
      - гранитоиды
      - магматический очаг
      - magmatism
      - intrusion
      - granitoid
      - dyke

  палеодолины и впадины:
    род: рудоконтролирующий фактор
    определение: >-
      Погребённые долины и понижения древнего рельефа: вмещают россыпи и
      определяют переотложение материала, указывая на коренной источник выше
      по потоку.
    синонимы:
      - палеодолина
      - погребённая долина
      - древняя долина
      - палеорельеф
      - россыпь
      - коренной источник
      - paleovalley
      - buried valley
      - placer

  плотностная и магнитная неоднородность:
    род: рудоконтролирующий фактор
    определение: >-
      Различия пород по плотности и намагниченности, видимые в гравиметрии и
      магнитометрии. Магнитные минимумы могут отвечать разрушению магнетита
      при гидротермальной переработке, но прямого подтверждения для этой зоны
      в найденной литературе нет.
    синонимы:
      - гравитационная аномалия
      - магнитная аномалия
      - магнитный минимум
      - плотностная неоднородность
      - гравиметрия
      - магнитометрия
      - аэромагнитная съёмка
      - gravity anomaly
      - magnetic anomaly
      - aeromagnetic

  рельеф и геоморфология:
    род: условие наблюдения
    определение: >-
      Формы рельефа и их производные. Косвенно отражают устойчивость пород и
      структуру, но в этом проекте высота даёт около половины сигнала прогноза
      сама по себе, поэтому связь с оруднением через рельеф требует поправки
      на тренд.
    синонимы:
      - геоморфология
      - цифровая модель рельефа
      - ЦМР
      - морфоструктура
      - морфометрический анализ
      - geomorphology
      - digital elevation model
      - DEM
      - SRTM

  обнажённость и растительный покров:
    род: условие наблюдения
    определение: >-
      Состояние поверхности, определяющее, что вообще способна увидеть
      дистанционная съёмка: под растительностью и рыхлым чехлом спектр
      принадлежит покрову, а не породам. Не рудный фактор, а условие
      наблюдения.
    синонимы:
      - обнажённость
      - растительный покров
      - рыхлые отложения
      - чехол рыхлых отложений
      - NDVI
      - vegetation cover
      - outcrop

# ТЕРРИТОРИИ — по ним фрагмент можно отобрать: «что про гидротермальные
# изменения написано по Билляхской зоне». Первое имя — каноническое, его
# передаёт запрос; остальные — как это пишут в статьях.
территории:
  Анабарский щит:        [Anabar shield]
  Билляхская зона:       [Билляхская тектоно-флюидитная зона, Билляхская зона разломов, Billyakh]
  Хаптасыннахская зона:  [Khaptasynnakh]
  Оленёкское поднятие:   [Olenek uplift]
  Сибирская платформа:   [Сибирский кратон, Siberian platform, Siberian craton]

# МЕТОДЫ — тем же способом: чем изучали.
методы:
  ASTER:                         [ASTER]
  Landsat:                       [Landsat]
  Sentinel:                      [Sentinel-2, Sentinel-1, Sentinel]
  дистанционное зондирование:    [remote sensing]
  линеаментный анализ:           [плотность линеаментов, lineament]
  аэрогамма-спектрометрия:       [АГСМ, гамма-спектрометрия, airborne gamma]
  гравиразведка:                 [gravity survey]
  магниторазведка:               [magnetic survey]
  геохимическая съёмка:          [вторичные ореолы, geochemical survey]
  машинное обучение:             [random forest, machine learning, нейронная сеть]
  метод весов доказательств:     [весов доказательств, weights of evidence]
  кокригинг:                     [cokriging]

# СВЯЗИ — что строит код. Добавить сюда новую связь нельзя: её надо сначала
# научить строить. Можно поменять подпись — так связь показывается наружу.
#
# «описывает» — главная: фрагмент статьи говорит о понятии по существу, а не
# мимоходом. Под каждой такой связью лежит дословная цитата из фрагмента.
# Две другие выводятся из неё: если фрагмент описывает понятие и в нём же
# названа территория или метод, связь получает этот фрагмент в основание.
связи:
  описывает:     {от: фрагмент, к: понятие,    подпись: описывает}
  проявлено_на:  {от: понятие,  к: территория, подпись: проявлено на}
  измеряет:      {от: метод,    к: понятие,    подпись: изучается методом}
