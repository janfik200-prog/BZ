# Настройки проверок кода: ruff, black, mypy --strict.
# Запуск всех трёх разом: python georag.py lint

[project]
name = "georag"
version = "0.1.0"
description = "Локальная база знаний по рудной геологии: поиск, чат-бот и граф связей по статьям"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".local"]
cache-dir = ".local/cache/ruff"  # кэши — в .local, корень проекта чистый

[tool.ruff.lint]
# E/W — стиль, F — ошибки (неиспользуемое, неопределённое), B — частые ловушки,
# UP — устаревшие конструкции, I — порядок импортов.
select = ["E", "W", "F", "B", "UP", "I"]
ignore = [
    "E501",   # длину строк держит black
    "B008",   # вызов в значении по умолчанию — так написаны dataclass-поля проекта
]

[tool.ruff.lint.isort]
known-first-party = ["georag"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/(\\.venv|\\.local)/"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true   # docling, sentence-transformers, psycopg — без заглушек типов
warn_unused_ignores = true
exclude = ["^\\.venv/", "^\\.local/"]
cache_dir = ".local/cache/mypy"

# PyMuPDF без аннотаций типов: вызовы из запасного парсера и зонда — не наша ошибка типов.
[[tool.mypy.overrides]]
module = ["georag.parse.parsers.pymupdf", "georag.parse.orchestrator.profile", "georag.parse.orchestrator.textlayer"]
disallow_untyped_calls = false
