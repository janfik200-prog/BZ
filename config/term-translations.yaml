# ПЕРЕВОДЫ ТЕРМИНОВ ДЛЯ КЛЮЧЕВЫХ ПОНЯТИЙ ВОПРОСА (index/concepts.py)
#
# Модель, выделяя из вопроса обязательные понятия, переводит их сама и ошибается:
# «лиственитизация» → «lignitization», «отношение калия к торию» — на «калий» и «торий».
# Если понятие есть здесь, английские написания берутся отсюда, а не от модели.
#
#   русское понятие: [английское написание, другое написание, сокращение]
#
# Падеж и число не важны. Правится Блокнотом, сохранять в UTF-8.
# Записан 30.10.2026 до составления проверочных вопросов (research/v15).

