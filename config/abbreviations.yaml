# СОКРАЩЕНИЯ — расшифровки, которые бот вправе писать в ответе.
#
# Фрагменты пишут «РОВ», «ФЕС», «НГК» без расшифровки, и модель расшифровывала их сама:
# «растительных остатков (РОВ)», «ФЕС (фазовые эффективные свойства)» (прогон 11.11.2026).
# Сокращение из этого списка бот расшифровывает только так, как здесь. Сокращение, которого
# нет ни здесь, ни во фрагментах («слова (СОКР)»), бот оставляет как есть.
#
# Файл правится Блокнотом (сохранять в UTF-8). Формат:
#
#   СОКРАЩЕНИЕ: расшифровка в именительном падеже
#
# Сюда — только однозначные. «ПК», «МК», «АК» (стадии катагенеза или виды каротажа),
# «ПС», названия организаций и участков — не вносить: значение зависит от отчёта.

ОВ: органическое вещество
РОВ: рассеянное органическое вещество
УВ: углеводороды
НГК: нефтегазоносный комплекс
НГО: нефтегазоносная область
НГП: нефтегазоносная провинция
НГБ: нефтегазоносный бассейн
НГР: нефтегазоносный район
ГЗН: главная зона нефтеобразования
ГФН: главная фаза нефтеобразования
ГЗГ: главная зона газообразования
АВПД: аномально высокое пластовое давление
АНПД: аномально низкое пластовое давление
ФЕС: фильтрационно-ёмкостные свойства
ГИС: геофизические исследования скважин
ВНК: водонефтяной контакт
ГНК: газонефтяной контакт
ГВК: газоводяной контакт
ТРИЗ: трудноизвлекаемые запасы
КИН: коэффициент извлечения нефти
НСР: начальные суммарные ресурсы
ГРР: геологоразведочные работы
МОГТ: метод общей глубинной точки
ВСП: вертикальное сейсмическое профилирование
