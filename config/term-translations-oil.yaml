# ПЕРЕВОДЫ НЕФТЯНЫХ ТЕРМИНОВ — дополнение к config/term-translations.yaml.
#
# На встрече 30.10.2026 бот путал «сланцевые (низкопроницаемые) толщи» (shale) с
# метаморфическими сланцами (schist) и «нефтематеринские» с «нефтеносными». В закрытой БЗ
# эти строки дописываются в config/term-translations.yaml (поиск по ключевым понятиям
# берёт английские написания оттуда). Формат тот же:
#
#   русское понятие: [английское написание, другое написание]

нефтематеринская порода: [source rock, petroleum source rock]
нефтематеринская толща: [source rock, source formation]
нефтематеринский потенциал: [source rock potential, hydrocarbon generation potential]
нефтеносный пласт: [oil-bearing reservoir, oil-saturated reservoir]
главная зона нефтеобразования: [oil window, main oil generation zone]
главная фаза нефтеобразования: [oil window, main oil generation phase]
кероген: [kerogen]
органическое вещество: [organic matter, TOC]
катагенез: [catagenesis, thermal maturity]
отражательная способность витринита: [vitrinite reflectance, Ro]
пиролиз: [Rock-Eval, pyrolysis]
водородный индекс: [hydrogen index, HI]
коллектор: [reservoir rock, reservoir]
терригенный коллектор: [clastic reservoir, siliciclastic reservoir]
карбонатный коллектор: [carbonate reservoir]
трещинный коллектор: [fractured reservoir]
пористость: [porosity]
проницаемость: [permeability]
фильтрационно-ёмкостные свойства: [reservoir properties, porosity and permeability]
покрышка: [seal, cap rock]
флюидоупор: [seal, cap rock, aquitard]
ловушка: [trap]
структурная ловушка: [structural trap]
литологическая ловушка: [stratigraphic trap, lithological trap]
неантиклинальная ловушка: [stratigraphic trap, non-structural trap]
рифовая постройка: [reef, reef buildup]
миграция углеводородов: [hydrocarbon migration]
залежь: [accumulation, pool, oil pool]
сланцевая нефть: [shale oil, tight oil]
сланцевые толщи: [shale, oil shale, shale formation]
низкопроницаемый коллектор: [tight reservoir, low-permeability reservoir]
трудноизвлекаемые запасы: [hard-to-recover reserves, unconventional reserves]
битуминозные породы: [bituminous rocks, bituminous shale]
аномально высокое пластовое давление: [overpressure, abnormally high formation pressure]
бассейновое моделирование: [basin modeling, basin modelling, petroleum system modeling]
нефтегазоносный бассейн: [petroleum basin, oil and gas basin]
нефтегазоносный комплекс: [petroleum play, oil and gas complex]
баженовская свита: [Bazhenov Formation]
тюменская свита: [Tyumen Formation]
Западная Сибирь: [West Siberia, Western Siberia]
Предкавказье: [Ciscaucasia]
Северный Кавказ: [North Caucasus]
Тимано-Печорская провинция: [Timan-Pechora]
Волго-Уральская провинция: [Volga-Ural]
